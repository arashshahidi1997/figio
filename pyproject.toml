[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "figio"
version = "0.1.0"
description = "Build orchestrator for reproducible scientific figures"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Arash" }]
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
figio = "figio.cli:main"

[project.optional-dependencies]
dev = ["pytest", "build", "twine"]
mpl = ["matplotlib>=3.7"]
export = ["cairosvg>=2.7"]
all = ["figio[mpl]", "figio[export]"]

[tool.setuptools.packages.find]
where = ["src"]
